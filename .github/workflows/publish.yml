name: Publish due Instagram posts

on:
  schedule:
    # Every 10 minutes. It used to be hourly, which read as "at worst an hour
    # late" but was not: GitHub delays or drops schedule events under load, and
    # on 20.9.2026 the 12:00 post sat in the queue for two hours because no run
    # fired between 11:09 and 14:08. This repo is public, so Actions minutes are
    # unlimited and running this often costs nothing. The Mac also kicks this
    # workflow after each slot (~/.local/bin/publish-kick.sh).
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: pip install --quiet pillow

      - name: Publish due posts
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 publish.py

      - name: Commit moved files
        # always(): publish.py exits 1 whenever any slot fails or is rejected,
        # but by then it may already have moved a slot to rejected/ or, worse,
        # published another slot and logged it. Skipping the commit on failure
        # threw both away: the rejected slot came back and failed every run, and
        # the post that did go out was not in published-log.jsonl, so the next
        # run (MIN_GAP reads that log) would publish it again. 17.10.2026.
        if: always()
        run: |
          git config user.name "stocklearneasy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "publish run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
