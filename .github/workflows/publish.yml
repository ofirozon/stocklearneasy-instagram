name: Publish due Instagram posts

on:
  schedule:
    # Every 10 minutes. It used to be hourly, which read as "at worst an hour
    # late" but was not: GitHub delays or drops schedule events under load, and
    # on 20.9.2026 the 12:00 post sat in the queue for two hours because no run
    # fired between 11:09 and 14:08. This repo is public, so Actions minutes are
    # unlimited and running this often costs nothing. The Mac also kicks this
    # workflow after each slot (~/.local/bin/publish-kick.sh).
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# One run at a time, and a queued run reads the branch tip (added 8.11.2026).
# On 7.11 two Mac kicks landed 3s apart (12:12:56Z and 12:12:59Z). With no
# concurrency group both runs checked out the same SHA, both saw the slot due
# and both posted it, so the 12:00 slot went live twice on each account. The
# second run's push was then rejected, so the run went red but the duplicate
# post was already up. channel-scheduler hit the same thing and got the same
# fix in 5f9c8c0.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # wait_for_slot.py may hold the job up to 290 min (default limit is 360).
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # Branch tip, not the SHA the event was created at: a run queued behind
          # the concurrency group must see the slot the first run already moved.
          ref: ${{ github.ref_name }}

      - name: Install dependencies
        run: pip install --quiet pillow

      - name: Wait for the next slot
        # GitHub delivers the */10 schedule every 3 to 4 hours, so with the Mac
        # asleep posts went out up to 8 hours late. A run that lands before a
        # slot sleeps until it instead (10.11.2026). Runs queued behind it in
        # the concurrency group then find nothing due, which is harmless.
        run: python3 wait_for_slot.py

      - name: Re-read the branch after waiting
        # The Mac may have held, rebuilt or added slots while this job slept.
        # Nothing is written before this point, so a hard reset loses nothing,
        # and unlike a pull it cannot trip over the depth-1 checkout.
        run: |
          git fetch --depth=1 --quiet origin "${{ github.ref_name }}"
          git reset --hard --quiet FETCH_HEAD

      - name: Publish due posts
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 publish.py

      - name: Commit moved files
        # always(): publish.py exits 1 whenever any slot fails or is rejected,
        # but by then it may already have moved a slot to rejected/ or, worse,
        # published another slot and logged it. Skipping the commit on failure
        # threw both away: the rejected slot came back and failed every run, and
        # the post that did go out was not in published-log.jsonl, so the next
        # run (MIN_GAP reads that log) would publish it again. 17.10.2026.
        if: always()
        run: |
          git config user.name "stocklearneasy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "publish run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
