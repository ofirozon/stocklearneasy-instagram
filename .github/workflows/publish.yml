name: Publish due Instagram posts

on:
  schedule:
    - cron: "5 * * * *"
    # A second, dedicated attempt just after each slot (12:00 and 18:00 UTC).
    # Added 20.9.2026: the hourly line above is declared hourly but GitHub
    # delivers it every 3 to 5 hours under load, and on 20.9 the 12:00 post sat
    # in the queue for two hours until it was kicked by hand. The Mac also kicks
    # this workflow after every slot (~/.local/bin/publish-kick.sh); this entry
    # is the fallback for when the Mac is off.
    - cron: "6 12,18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: pip install --quiet pillow

      - name: Publish due posts
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 publish.py

      - name: Commit moved files
        run: |
          git config user.name "stocklearneasy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "publish run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
