<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>Bull and Bear — the village</title>
<style>
  /* Fonts ship from disk, never the network: a frame grab must never depend
     on a font arriving in time (the mistake design.py made with Inter). */
  @font-face { font-family:"DM Serif Display"; font-weight:400; font-display:block;
               src:url("../assets/fonts/DMSerifDisplay_400Regular.ttf") format("truetype"); }
  @font-face { font-family:"DM Sans"; font-weight:400; font-display:block;
               src:url("../assets/fonts/DMSans_400Regular.ttf") format("truetype"); }
  @font-face { font-family:"DM Sans"; font-weight:500; font-display:block;
               src:url("../assets/fonts/DMSans_500Medium.ttf") format("truetype"); }
  @font-face { font-family:"DM Sans"; font-weight:700; font-display:block;
               src:url("../assets/fonts/DMSans_700Bold.ttf") format("truetype"); }

  :root {
    --text:#f8fafc; --muted:#b8c6d8;
    --green:#22c55e; --green-soft:#6ee7a0; --red:#f04d4d; --red-soft:#ff8f8f;
    --gold:#facc15;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1920px; overflow:hidden; background:#070f1d; }
  body { font-family:"DM Sans", sans-serif; color:var(--text); }
  #stage { position:relative; width:1080px; height:1920px; overflow:hidden; }
  svg#world { position:absolute; left:0; top:0; }

  /* --- type --------------------------------------------------------------
     Instagram covers 14% of the frame at the top (~270px) and 35% at the
     bottom (~670px), plus 6% each side. Everything that has to be read lives
     inside y 270..1250. The old layout put the app strip at 1636 and the
     footer at 1806, both of them underneath Instagram's own caption stack. */
  .title {
    position:absolute; left:0; width:1080px; text-align:center;
    font-family:"DM Serif Display", serif; font-weight:400;
    font-size:88px; line-height:1.06; letter-spacing:-.01em;
    padding:0 90px;
    text-shadow:0 10px 40px rgba(0,0,0,.6);
  }
  .title.caps { letter-spacing:.02em; }

  /* Burned-in captions. 85 to 88 percent of reels are watched muted, and
     burned-in beats Instagram's auto-captions 2.5x and no captions 3.4x. */
  #caption {
    position:absolute; left:0; width:1080px; text-align:center;
    top:1040px; padding:0 110px;
    font-weight:700; font-size:54px; line-height:1.22; letter-spacing:-.005em;
    color:#fff; text-shadow:0 4px 18px rgba(4,10,20,.95), 0 0 46px rgba(4,10,20,.8);
  }

  /* A small mark instead of a three second end card. It is present in the
     first and last frame alike, so it never breaks the loop. */
  #brand {
    position:absolute; left:70px; top:286px;
    display:flex; gap:16px; align-items:center;
  }
  #brand img { width:54px; height:54px; border-radius:13px; display:block; }
  #brand span { font-weight:700; font-size:27px; letter-spacing:.04em; color:#cddae8;
                text-shadow:0 3px 14px rgba(4,10,20,.9); }
</style>
</head>
<body>
<div id="stage">
<svg id="world" width="1080" height="1920" viewBox="0 0 1080 1920">

<script>
// The episode data and the caption timings are per render, not global: two
// renders overlapping once wrote each other's files and produced a film with
// one episode's title, another's chart and a third's captions. render.py now
// passes ?d=data-<runid>.js and this pulls in that one file. document.write
// of a script tag blocks parsing until it has loaded, which is exactly the
// synchronous behaviour the rest of the scene assumes.
(function () {
  var d = new URLSearchParams(location.search).get("d");
  if (d && /^[A-Za-z0-9._-]+$/.test(d)) {
    document.write('<scr' + 'ipt src="' + d + '"></scr' + 'ipt>');
  } else {
    document.write('<scr' + 'ipt src="episode.js"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="captions.js"></scr' + 'ipt>');
  }
})();
</script>
<script>
// ---------------------------------------------------------------------------
// Every visual property is a pure function of t, the timestamp in the query
// string. Nothing is driven by CSS animation or rAF: the frame grabber launches
// a fresh browser per frame, so anything that reads the wall clock would land
// on a different part of the motion each run.
// ---------------------------------------------------------------------------
const T = parseFloat(new URLSearchParams(location.search).get("t") || "0");
const DUR = 20.5;

const clamp = (v,a,b) => Math.min(b, Math.max(a,v));
const lerp  = (a,b,u) => a + (b-a)*u;
const easeOut   = u => 1 - Math.pow(1-u, 3);
const easeInOut = u => u < .5 ? 4*u*u*u : 1 - Math.pow(-2*u+2, 3)/2;
const easeBack  = u => { const c=1.7; return 1 + (c+1)*Math.pow(u-1,3) + c*Math.pow(u-1,2); };
const seg = (a,b,ease=easeOut) => ease(clamp((T-a)/(b-a), 0, 1));
/** 1 while t is inside [a,b] with fade margins, 0 outside — for text swaps */
function band(a,b,fade=.34) {
  if (T < a || T > b) return 0;
  return Math.min(clamp((T-a)/fade,0,1), clamp((b-T)/fade,0,1));
}
const el = id => document.getElementById(id);
const SVG = "http://www.w3.org/2000/svg";
function mk(tag, attrs, parent) {
  const n = document.createElementNS(SVG, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
/** deterministic PRNG: the world must be identical in every frame process */
function rng(seed) {
  let s = seed >>> 0;
  return () => { s = (s + 0x6D2B79F5) >>> 0;
    let x = Math.imul(s ^ (s >>> 15), 1 | s);
    x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };
}
const rgb = c => `rgb(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])})`;
const mixc = (a,b,u) => [lerp(a[0],b[0],u), lerp(a[1],b[1],u), lerp(a[2],b[2],u)];

// ---------------------------------------------------------------------------
// The episode. episode.js is written by render.py from episodes/<id>.js, and
// everything that varies between topics lives in it: the four titles, the
// three chart shapes, and which animal does what in the two teaching beats.
// The structure itself never changes, because it is the structure the research
// endorsed: cold open on the answer, rewind, teach A, teach B, land back.
// ---------------------------------------------------------------------------
const EP = Object.assign({
  hookTitle:  "Why a bull,<br>and why a bear?",
  closeTitle: "Horns up.<br>Paws down.",
  a: {actor: "bull", action: "rearUp", mood: "bull", chart: "UP",
      title: '<span style="color:var(--green-soft)">BULL MARKET</span>',
      label: "#4ade80"},
  b: {actor: "bear", action: "swipe", mood: "bear", chart: "DOWN",
      title: '<span style="color:var(--red-soft)">BEAR MARKET</span>',
      label: "#ff8f8f"},
  hookCharts: ["UP", "DOWN"],
  hookColors: ["#22c55e", "#f04d4d"],
}, (typeof window.EPISODE !== "undefined") ? window.EPISODE : {});

// --- scenes ----------------------------------------------------------------
const S0 = [0.00,  3.20];   // cold open: the answer frame, with the question on it
const S1 = [3.20,  6.60];   // rewind to the quiet village
const S2 = [6.60, 12.30];   // the bull
const S3 = [12.30,18.00];   // the bear
const S4 = [18.00,20.50];   // back to the opening frame, so the loop is invisible
const inS = s => T >= s[0] && T < s[1];

// ---------------------------------------------------------------------------
// mood: the lighting is the explanation, so the words do not have to be
// ---------------------------------------------------------------------------
const MOOD = {
  // glowL is the bull's side of the horizon, glowR the bear's. A scene can
  // light one, the other, or both; "duel" is both, and it is the frame the
  // film opens and closes on.
  calm: {top:[8,20,39],  mid:[18,48,90],  bot:[31,78,124], star:1.00,
         glowL:[90,150,210], glowLA:0.18, glowR:[90,150,210], glowRA:0.10,
         cloud:0.46, cloudC:[126,152,188], win:1.00, moon:1.00, hillF:[26,52,84], hillF2:[22,44,72],
         hillN:[16,32,54], village:[32,54,84], road:[40,30,21]},
  bull: {top:[8,30,40],  mid:[16,66,68],  bot:[36,104,88], star:0.06,
         glowL:[34,197,94], glowLA:0.56, glowR:[34,197,94], glowRA:0.16,
         cloud:0.28, cloudC:[150,212,180], win:0.45, moon:0.18, hillF:[26,74,62], hillF2:[22,62,54],
         hillN:[16,44,38], village:[28,64,58], road:[48,38,24]},
  bear: {top:[14,9,24],  mid:[42,16,38],  bot:[68,24,40],  star:0.30,
         glowL:[240,77,77], glowLA:0.14, glowR:[240,77,77], glowRA:0.50,

const KF = [[0,'duel'],[S0[1]-0.45,'duel'],[S1[0]+0.55,'calm'],[S2[0],'calm'],
            [S2[0]+0.8,EP.a.mood],[S3[0],EP.a.mood],[S3[0]+0.8,EP.b.mood],[S4[0],EP.b.mood],

function mood() {
  let i = 0;
  while (i < KF.length-2 && T > KF[i+1][0]) i++;
  const [t0,a] = KF[i], [t1,b] = KF[i+1];
  const u = t1 === t0 ? 1 : easeInOut(clamp((T-t0)/(t1-t0),0,1));

  for (const k in A) o[k] = Array.isArray(A[k]) ? mixc(A[k],B[k],u) : lerp(A[k],B[k],u);

}

/** Build the legs in JS so the drawn length can never disagree with the rig. */
function buildLegs(name) {
  const R = RIG[name];
  R.nodes = R.legs.map(L => {
    const parent = el(L.far ? R.far : R.near);
    const g  = mk("g", {}, parent);
    mk("line", {x1:0, y1:0, x2:0, y2:L.up, stroke:L.far ? R.thighF : R.thigh,
                "stroke-width":L.far ? 26 : 30, "stroke-linecap":"round"}, g);
    const shin = mk("g", {}, g);
    mk("line", {x1:0, y1:0, x2:0, y2:L.lo, stroke:L.far ? R.shinF : R.shin,
                "stroke-width":L.far ? 19 : 22, "stroke-linecap":"round"}, shin);
    mk("ellipse", {cx:0, cy:L.lo+4, rx:L.far ? 13 : 15, ry:L.far ? 8 : 10,
                   fill:L.far ? R.hoofF : R.hoof}, shin);
    return {g, shin};
  });
}
buildLegs("bull");
buildLegs("bear");

/** One stride of a quadruped walk. p is in cycles, not seconds, so the feet
    are driven by distance travelled and can never slide along the road. */
function poseLegs(name, p, moving) {
  const R = RIG[name];
  R.legs.forEach((L, i) => {
    const n = R.nodes[i];
    const a = 2*Math.PI*(p + L.ph);
    const swing = moving ? 1 : 0.12;          // a standing animal still shifts
    const thigh = 25*Math.sin(a) * swing;
    // the knee only ever folds backwards, and only during the swing half
    const knee  = -Math.max(0, 34*Math.sin(a + 1.15)) * swing;
    n.g.setAttribute("transform",
      `translate(${L.hip[0]} ${L.hip[1]}) rotate(${thigh.toFixed(2)})`);
    n.shin.setAttribute("transform",
      `translate(0 ${L.up}) rotate(${knee.toFixed(2)})`);
  });
}

/** x is world position of the ground point under the chest; dir 1 faces right.
    The rotation pivots on the hind hooves (PIVOT art-units behind the origin),
    so rearing up lifts the front end instead of swinging the whole animal
    around its middle. Mirroring maps up to up, so the sign holds for dir -1. */
const PIVOT = -62;
function place(id, x, y, s, dir, rot) {
  el(id).setAttribute("transform",
    `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${(dir*s).toFixed(4)} ${s.toFixed(4)}) ` +
    `translate(${PIVOT} 0) rotate(${(rot||0).toFixed(2)}) translate(${-PIVOT} 0)`);
}
/** deterministic blink: a hard-edged lid drop every few seconds */
function blink(id, offset) {
  const c = ((T + offset) % 3.7) / 3.7;
  el(id).setAttribute("opacity", c > 0.955 ? 1 : 0);
}

// --- choreography ----------------------------------------------------------
const BIG = 1.12, SMALL = 0.92;

// The answer frame. The film opens here and comes back here, so it is defined
// once and both ends read it: bull reared on the left with the horns up, bear
// mid-slam on the right with the paw down, the board between them.
const POSE = {
  bullX: 340, bullY: GROUND - 16, bullS: SMALL, bullRot: -19,
  bearX: 930, bearY: GROUND - 6,  bearS: SMALL, bearRot: 5,
  pawAng: 12,
};

// Where each animal lives when it is not on its mark.
const HOME = {bull: {off: -420, mark: 830}, bear: {off: 1760, mark: 740}};

/** One teaching scene, as a pure function of t.
 *
 *  Every episode is the same five beats, so the only things that change are
 *  which animal is on stage and what it does. `prev` carries the positions the
 *  previous scene ended on, which is what lets the close blend back to POSE
 *  without the episode data having to state it.
 */
function sceneLayout(t, S, spec, prevBull, prevBear) {
  const sg = (a, b, ease) => ease(clamp((t - a) / (b - a), 0, 1));
  const o = {bullX: prevBull, bearX: prevBear, bullY: GROUND, bearY: GROUND,
             bullS: BIG, bearS: BIG, bullRot: 0, bearRot: 0,
             bullMove: false, bearMove: false,
             pawOn: 0, pawAng: 0, swipeHit: 0};

  const both = !!spec.both;
  const actors = both ? ["bull", "bear"] : [spec.actor];
  const idle = both ? [] : [spec.actor === "bull" ? "bear" : "bull"];

  // whoever is not acting leaves, in its own direction
  for (const who of idle) {
    const out = sg(S[0], S[0] + 1.30, easeInOut);
    o[who + "X"] = lerp(who === "bull" ? prevBull : prevBear, HOME[who].off, out);
    o[who + "Move"] = out < 1;
  }

  // the actors walk to their marks and then perform
  actors.forEach((who, i) => {
    const from = who === "bull" ? prevBull : prevBear;
    // with both on stage the camera has already panned right, so their marks
    // have to sit further into the world or the bull falls off the left edge
    const mark = both ? (who === "bull" ? 520 : 940) : HOME[who].mark;
    const walkEnd = S[0] + 2.70;
    o[who + "X"] = lerp(from, mark, sg(S[0] + 0.15, walkEnd, easeInOut));
    o[who + "Move"] = t < walkEnd;

    const act = both ? (who === "bull" ? "rearUp" : "swipe") : spec.action;
    // stagger the two actors so the frame never has both moving at once
    const at = S[0] + 3.05 + (both ? i * 1.25 : 0);

    if (act === "rearUp") {
      const th = clamp((t - at) / 1.05, 0, 1);
      if (th > 0) {
        const dip  = Math.sin(Math.PI * clamp(th / 0.28, 0, 1));
        const rise = th > 0.28 ? easeOut(clamp((th - 0.28) / 0.72, 0, 1)) : 0;
        o[who + "Y"] -= 16 * rise - 24 * dip;
        o[who + "Rot"] = -19 * rise + 5 * dip;     // horns pitch up
        o[who + "S"]  += 0.03 * rise;
      }
      if (both) o[who + "Move"] = t < walkEnd;

    } else if (act === "swipe") {
      const sw = clamp((t - at) / 1.10, 0, 1);
      if (sw > 0) {
        const rear = Math.sin(Math.PI * clamp(sw / 0.34, 0, 1));
        const slam = sw > 0.34 ? easeOut(clamp((sw - 0.34) / 0.66, 0, 1)) : 0;
        o[who + "Y"] -= 20 * rear - 14 * slam;
        o[who + "Rot"] = -17 * rear + 5 * slam;    // paw drives down
        o.pawAng  = -58 * rear + 12 * slam;
        o.pawOn   = clamp(sw / 0.12, 0, 1);
        o.swipeHit = clamp((sw - 0.62) / 0.38, 0, 1);
      }

    } else if (act === "pace") {
      // keeps walking the whole beat: for lessons about staying the course
      const span = S[1] - S[0] - 0.4;
      const u = clamp((t - S[0] - 0.2) / span, 0, 1);
      o[who + "X"] = lerp(from, mark + 120 * Math.sin(u * Math.PI * 2), u > 0 ? 1 : 0);
      o[who + "X"] = lerp(from, mark, sg(S[0] + 0.15, S[0] + 2.0, easeInOut))
                   + 110 * Math.sin(clamp((t - S[0] - 2.0) / 1.9, 0, 10) * Math.PI);
      o[who + "Move"] = true;
    }
  });
  return o;
}

let bullX, bullS = BIG, bullDir = 1, bullY = GROUND, bullRot = 0, bullMove = true;
let bearX, bearS = BIG, bearDir = -1, bearY = GROUND, bearRot = 0, bearMove = true;
let pawOn = 0, pawAng = 0, swipeHit = 0, headTilt = 0;

// S1 leaves them here, and both teaching scenes chain off it
const S1_BULL = 300, S1_BEAR = 800;
const aEnd = sceneLayout(S2[1], S2, EP.a, S1_BULL, S1_BEAR);
const bEnd = sceneLayout(S3[1], S3, EP.b, aEnd.bullX, aEnd.bearX);

function apply(o) {
  bullX = o.bullX; bearX = o.bearX;
  bullY = o.bullY; bearY = o.bearY;
  bullS = o.bullS; bearS = o.bearS;
  bullRot = o.bullRot; bearRot = o.bearRot;
  bullMove = o.bullMove; bearMove = o.bearMove;
  pawOn = o.pawOn; pawAng = o.pawAng; swipeHit = o.swipeHit;
}

if (inS(S0)) {                                  // cold open: hold the answer frame
  bullX = POSE.bullX;  bullY = POSE.bullY;  bullS = POSE.bullS;  bullRot = POSE.bullRot;
  bearX = POSE.bearX;  bearY = POSE.bearY;  bearS = POSE.bearS;  bearRot = POSE.bearRot;
  pawOn = 1;  pawAng = POSE.pawAng;
  bullMove = bearMove = false;
  headTilt = 1;

} else if (inS(S1)) {                           // rewind: both stroll into town
  // they leave the held pose and settle into a walk, which reads as the film
  // rewinding to the beginning of the story
  const u = seg(S1[0], S1[0]+1.10, easeInOut);
  bullX = lerp(POSE.bullX, S1_BULL, u);
  bearX = lerp(POSE.bearX, S1_BEAR, u);
  bullY = lerp(POSE.bullY, GROUND, u);  bearY = lerp(POSE.bearY, GROUND, u);
  bullRot = lerp(POSE.bullRot, 0, u);   bearRot = lerp(POSE.bearRot, 0, u);
  bullS = bearS = lerp(SMALL, BIG, u);
  pawOn = 1 - clamp(u * 2.4, 0, 1);
  pawAng = POSE.pawAng;
  bullMove = bearMove = u > 0.5;

} else if (inS(S2)) {
  apply(sceneLayout(T, S2, EP.a, S1_BULL, S1_BEAR));

} else if (inS(S3)) {
  apply(sceneLayout(T, S3, EP.b, aEnd.bullX, aEnd.bearX));

} else {                                         // land back on the answer frame
  const u = seg(S4[0], DUR, easeInOut);
  const back = seg(S4[0], S4[0]+1.5, easeBack);
  bullX = lerp(bEnd.bullX, POSE.bullX, back);
  bearX = lerp(bEnd.bearX, POSE.bearX, back);
  bullY = lerp(GROUND, POSE.bullY, u);  bearY = lerp(GROUND, POSE.bearY, u);
  bullS = lerp(BIG, POSE.bullS, u);     bearS = lerp(BIG, POSE.bearS, u);
  bullRot = lerp(0, POSE.bullRot, u);   bearRot = lerp(bEnd.bearRot, POSE.bearRot, u);
  pawOn = 1;  pawAng = POSE.pawAng;
  bullMove = u < 0.9 && Math.abs(POSE.bullX - bEnd.bullX) > 60;
  bearMove = u < 0.9 && Math.abs(POSE.bearX - bEnd.bearX) > 60;
  headTilt = 1;
}

/** body bob and pitch at twice the stride, so the animal reads as one rhythm */
function carriage(x, s, moving) {
  const p = x / 170;
  const b = moving ? 1 : 0.22;
  return {p, dy: -(5.5*b)*Math.cos(4*Math.PI*p) - (moving?3:0),
             rot: (1.9*b)*Math.sin(4*Math.PI*p) + (moving ? 0 : 1.1*Math.sin(T*1.5)) };
}
const bc = carriage(bullX, bullS, bullMove);
const br = carriage(bearX, bearS, bearMove);
poseLegs("bull", bc.p, bullMove);
poseLegs("bear", br.p, bearMove);
place("bull", bullX, bullY + bc.dy*bullS, bullS, bullDir, bullRot + bc.rot);
place("bear", bearX, bearY + br.dy*bearS, bearS, bearDir, bearRot + br.rot);
el("bearPaw").setAttribute("transform", `rotate(${pawAng.toFixed(2)} 256 158)`);
el("bearPaw").setAttribute("opacity", pawOn.toFixed(3));
// the rigged near fore leg steps aside for the swiping arm
RIG.bear.nodes[3].g.setAttribute("opacity", (1 - pawOn).toFixed(3));
blink("bullLid", 0.0);
blink("bearLid", 1.9);
// the pupils look where the story is: at each other, or up/down with the move
el("bullPupil").setAttribute("transform",
  `translate(${headTilt ? 3 : 4} ${inS(S2) ? -4 : 0})`);
el("bearPupil").setAttribute("transform",
  `translate(${headTilt ? 3 : 4} ${inS(S3) ? 4 : 0})`);

// --- what makes them belong to the scene ------------------------------------

// A contact shadow on the road. It tightens and darkens as the animal plants
// and spreads and fades as it rears, which is the cue that sells the weight.
(function shadows() {
  const g = el("shadows");
  function cast(x, y, s) {
    const lift = clamp((GROUND - y) / 90, 0, 1);       // 0 planted, 1 airborne
    const w = (168 + 70*lift) * s, h = (26 - 7*lift) * s;
    mk("ellipse", {cx:x.toFixed(1), cy:(GROUND + 6).toFixed(1),
                   rx:w.toFixed(1), ry:h.toFixed(1),
                   fill:"url(#gShadow)", opacity:(1 - 0.45*lift).toFixed(3)}, g);
  }
  cast(bullX, bullY, bullS);
  cast(bearX, bearY, bearS);
})();

// Secondary motion: the tail, the hanging scarf end and the ears run off the
// stride phase but lag behind it, so the body leads and the loose parts follow.
(function secondary() {
  function dress(tailId, scarfId, earId, p, moving, phase) {
    const lag = 2*Math.PI*(p - 0.18);
    const amp = moving ? 1 : 0.3;
    const idle = Math.sin(T*1.4 + phase);
    if (tailId)
      el(tailId).setAttribute("transform",
        `rotate(${(9*amp*Math.sin(lag) + 3*idle).toFixed(2)} 72 168)`);
    el(scarfId).setAttribute("transform",
      `rotate(${(-11*amp*Math.sin(lag + 0.6) - 4*idle).toFixed(2)} 252 170)`);
    // the ear flicks on its own clock, not the gait's
    const flick = ((T + phase) % 2.9) / 2.9;
    el(earId).setAttribute("transform",
      `rotate(${(flick > 0.93 ? -14*Math.sin((flick-0.93)/0.07*Math.PI) : 0).toFixed(2)} 284 72)`);
  }
  dress("bullTail", "bullScarf", "bullEar", bc.p, bullMove, 0.0);
  dress(null,       "bearScarf", "bearEar", br.p, bearMove, 1.7);
})();

// The rim light tracks the mood, and only shows up once the horizon is
// actually glowing: in the calm scenes there is nothing to catch.
(function rim() {
  // each animal catches the light on its own side of the horizon
  const pairs = [["rimBullColor", M.glowL, M.glowLA], ["rimBearColor", M.glowR, M.glowRA]];
  for (const [id, col, a] of pairs) {
    el(id).setAttribute("flood-color", rgb(col));
    el(id).setAttribute("flood-opacity",
      (0.3 * clamp((a - 0.22) / 0.3, 0, 1)).toFixed(3));
  }
})();

// dust under the hooves, only while a foot is actually driving
(function dust() {
  const g = el("dust");
  function puff(x, s, moving, phase) {
    if (!moving) return;
    const k = (phase % 1 + 1) % 1;
    const o = Math.max(0, Math.sin(Math.PI*k)) * 0.14;
    if (o < 0.015) return;
    const r = 12 + 38*k;
    mk("ellipse", {cx:(x + 30*s).toFixed(1), cy:(GROUND - 6).toFixed(1),
                   rx:(r*s).toFixed(1), ry:(r*0.34*s).toFixed(1),
                   fill:"#c9b08c", opacity:o.toFixed(3)}, g);
  }
  puff(bullX, bullS, bullMove, bc.p);
  puff(bullX, bullS, bullMove, bc.p + 0.5);
  puff(bearX, bearS, bearMove, br.p);

  // the swipe landing: one wide, fast puff where the paw meets the road
  if (swipeHit > 0.01) {
    const k = swipeHit, o = 0.4 * (1 - k) * (1 - k);
    const px = bearX + bearDir * 150 * bearS;
    for (let i = 0; i < 3; i++) {
      const spread = (i - 1) * 46 * k;
      mk("ellipse", {cx:(px + spread * bearDir).toFixed(1),
                     cy:(GROUND - 4 - 26 * k * (1 - Math.abs(i - 1) * 0.4)).toFixed(1),
                     rx:((22 + 54 * k) * bearS).toFixed(1),
                     ry:((11 + 22 * k) * bearS).toFixed(1),
                     fill:"#c9b08c", opacity:o.toFixed(3)}, g);
    }
  }
})();

// ---------------------------------------------------------------------------
// the price line on the board
// ---------------------------------------------------------------------------
// Every chart is drawn in the board's 0..374 by 0..212 box, top-left origin,
// so a new lesson is a new path and nothing else.
const PATHS = {
  UP:    "M14 196 L72 168 L130 180 L188 120 L246 136 L304 64 L360 26",
  DOWN:  "M14 26  L72 56  L130 44  L188 104 L246 88  L304 158 L360 196",
  FLAT:  "M14 136 L72 122 L130 134 L188 116 L246 130 L304 114 L360 124",
  // a 10% dip that recovers: the shape of a correction
  DIP:   "M14 110 L72 96  L130 150 L188 158 L246 132 L304 104 L360 88",
  // a drop that keeps going, lower highs all the way down
  SLIDE: "M14 36  L72 74  L130 58  L188 118 L246 100 L304 164 L360 190",
  // noise with no trend: the price arguing with itself
  NOISE: "M14 120 L50 52 L86 170 L122 70 L158 184 L194 64 L230 176 L266 58 L302 166 L338 76 L360 130",
  // the same data seen from far away: the noise shrinks into a trend
  TREND: "M14 178 L72 166 L130 150 L188 132 L246 112 L304 86 L360 54",
  // flat for ages, then the curve bends: compounding
  SLOW:  "M14 190 L72 186 L130 180 L188 172 L246 162 L304 150 L360 136",
  FAST:  "M14 190 L72 184 L130 172 L188 150 L246 116 L304 68 L360 14",
};
const line = el("chartLine"), line2 = el("chartLine2"), dot = el("chartDot");
let chartOn = 0, drawFrom = 0;

if (inS(S0) || inS(S4)) {
  // the answer frame carries both shapes at once: that single image is the
  // entire lesson, and it is what has to stop the scroll
  const on = inS(S0) ? 1 : seg(S4[0], S4[0]+0.9, easeOut);
  line.setAttribute("d", PATHS[EP.hookCharts[0]]);  line.setAttribute("stroke", EP.hookColors[0]);
  line2.setAttribute("d", PATHS[EP.hookCharts[1]]); line2.setAttribute("stroke", EP.hookColors[1]);
  line.style.strokeDasharray = ""; line.style.strokeDashoffset = "";
  line.style.opacity = on;  line2.setAttribute("opacity", on);
  el("chartHead").style.opacity = 0;
  el("signLabel").setAttribute("fill", "#9fb0c4");

} else if (inS(S2) || inS(S3)) {
  const S = inS(S2) ? S2 : S3, spec = inS(S2) ? EP.a : EP.b;
  chartOn = band(S[0]+1.0, S[1]-0.10, .5);
  line.setAttribute("d", PATHS[spec.chart]);
  line.setAttribute("stroke", spec.label); dot.setAttribute("fill", spec.label);
  drawFrom = S[0]+1.1;
  el("signLabel").setAttribute("fill", spec.label);
  line.style.opacity = chartOn; line2.setAttribute("opacity", 0);

} else {
  line.setAttribute("d", PATHS.FLAT); line.setAttribute("stroke", "#5b7390");
  line.style.strokeDasharray = ""; line.style.strokeDashoffset = "";
  line.style.opacity = 0.75; line2.setAttribute("opacity", 0);
  el("chartHead").style.opacity = 0;
  el("signLabel").setAttribute("fill","#7f93aa");
}

if (chartOn > 0) {
  const len = line.getTotalLength();
  const u = easeInOut(clamp((T - drawFrom) / 2.0, 0, 1));
  line.style.strokeDasharray = len;
  line.style.strokeDashoffset = len * (1 - u);
  const p = line.getPointAtLength(len * Math.max(u, 0.001));
  el("chartHead").setAttribute("transform", `translate(${p.x} ${p.y})`);
  el("chartHead").style.opacity = u > 0.02 ? chartOn : 0;
}

// ---------------------------------------------------------------------------
// copy
// ---------------------------------------------------------------------------
function text(node, html, top, o, rise=0) {
  if (o > 0) node.innerHTML = html;
  node.style.top = (top + rise*(1-o)) + "px";
  node.style.opacity = o;
}
const title = el("title");

// The title sits high in the safe band; the captions sit low in it. Nothing
// else competes, because the captions now say what the old sub-line said.
if (inS(S0)) {
  text(title, EP.hookTitle, 372,
       clamp((S0[1] - T) / 0.3, 0, 1), 24);
  title.className = "title";

} else if (inS(S1)) {
  text(title, "", 320, 0);

} else if (inS(S2)) {
  text(title, EP.a.title, 390, band(S2[0]+0.45, S2[1], .3), 28);
  title.className = "title caps";

} else if (inS(S3)) {
  text(title, EP.b.title, 390, band(S3[0]+0.45, S3[1], .3), 28);
  title.className = "title caps";

} else {
  // the closing title has to be gone before the last frame, or it would not
  // match the opening frame and the loop would show a seam
  text(title, EP.closeTitle, 372,
       band(S4[0]+0.25, DUR-0.55, .28), 24);
  title.className = "title";
}

// --- burned-in captions -----------------------------------------------------
// captions.js is generated by render.py from the measured voice clips, so the
// cards can never drift out of sync with the audio. If it is missing the film
// still renders, just silent-unfriendly.
(function captions() {
  const node = el("caption");
  const cards = (typeof window.CAPTIONS !== "undefined" && !inS(S0))
    ? window.CAPTIONS : [];
  let shown = "", o = 0;
  for (const c of cards) {
    if (T >= c.t0 - 0.08 && T < c.t1 + 0.08) {
      shown = c.text;
      // a short fade at each edge, so cards change without flickering
      o = Math.min(clamp((T - (c.t0 - 0.08)) / 0.1, 0, 1),
                   clamp(((c.t1 + 0.08) - T) / 0.1, 0, 1));
      break;
    }
  }
  node.textContent = shown;
  node.style.opacity = o;
})();

// the mark is on from the first frame to the last, which is also what keeps
// it from breaking the loop
el("brand").style.opacity = 1;
</script>
</body>
</html>
